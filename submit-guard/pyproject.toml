[project]
name = "submit-guard"
version = "0.1.0"
description = "Code-level guards that keep a Playwright-driven Chrome from submitting a form"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = ["playwright>=1.60"]

[project.optional-dependencies]
test = ["pytest>=8"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["submit_guard"]

[tool.pytest.ini_options]
testpaths = ["tests"]
